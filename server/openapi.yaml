openapi: 3.0.3
info:
  title: Flash Sale API
  version: 1.0.0
servers:
  - url: http://localhost:4000
paths:
  /:
    get:
      summary: Root
      responses:
        "200":
          description: Hello World
          content:
            text/plain:
              schema:
                type: string
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /flash-sales:
    get:
      summary: List active flash sales
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Flash sales list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashSaleListResponse"
        "404":
          description: Flash sales not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /flash-sales/{id}:
    get:
      summary: Get flash sale by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flash sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashSaleResponse"
        "400":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products/sale/{saleId}:
    get:
      summary: List products by flash sale
      parameters:
        - in: path
          name: saleId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders:
    post:
      summary: Create order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          nullable: true
    FlashSale:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        imageUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FlashSaleListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            total:
              type: integer
            items:
              type: array
              items:
                $ref: "#/components/schemas/FlashSale"
            page:
              type: integer
            limit:
              type: integer
        page:
          type: integer
        limit:
          type: integer
    FlashSaleResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/FlashSale"
    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        imageUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        totalStock:
          type: integer
        remainingStock:
          type: integer
        saleId:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProductListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            total:
              type: integer
            items:
              type: array
              items:
                $ref: "#/components/schemas/Product"
            page:
              type: integer
            limit:
              type: integer
        page:
          type: integer
        limit:
          type: integer
    CreateOrderRequest:
      type: object
      required:
        - userName
        - productId
        - quantity
        - totalPrice
        - orderDate
      properties:
        userName:
          type: string
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
        totalPrice:
          type: number
          minimum: 0
        orderDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, completed, cancelled]
          default: pending
    CreateOrderResponse:
      type: object
      properties:
        message:
          type: string
          example: Order created successfully
        order:
          $ref: "#/components/schemas/Order"
    Order:
      type: object
      properties:
        _id:
          type: string
        productId:
          type: string
        userName:
          type: string
        quantity:
          type: integer
        totalPrice:
          type: number
        orderDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, completed, cancelled]
        systemNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
