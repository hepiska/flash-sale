version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./local_data/rabbitmq:/var/lib/rabbitmq
  mongodb:
    image: mongo:latest
    container_name: mongodb
    environment:
      environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27019:27017"
    volumes:
      - ./local_data/mongodb:/data/db
  k6:
    image: grafana/k6:latest
    container_name: k6
    volumes:
      - ./perf-test/k6:/scripts
    command: run --out influxdb=http://influxdb:8086/k6 /scripts/test.js
    depends_on:
      influxdb:
        condition: service_healthy

  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - ./local_data/influxdb:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "influx", "-execute", "SHOW DATABASES"]
      interval: 10s
      timeout: 5s
      retries: 10
